version: '3.8'

services:
  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=warehouse_db
      - POSTGRES_USER=warehouse_user
      - POSTGRES_PASSWORD=warehouse_password
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
