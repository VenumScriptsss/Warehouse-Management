{% extends 'base.html' %}
{% block title %}Log In - Warehouse Management{% endblock %}

{% block content %}
<div class="bg-primary text-white p-6">
</div>
<div class="login-page min-h-[calc(100vh-120px)] py-8 flex items-center justify-center">
    <div class="login-container bg-white rounded-xl p-8 shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-primary text-center mb-6">Welcome Back</h1>

        <!-- Django Messages Display -->
        {% if messages %}
        <div class="messages mb-6 space-y-2">
            {% for message in messages %}
            <div class="alert p-3 rounded-md {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% elif message.tags == 'success' %}bg-green-50 border border-green-200 text-green-700{% else %}bg-blue-50 border border-blue-200 text-blue-700{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}" class="space-y-4">
            {% csrf_token %}

            <div class="form-group">
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required autofocus class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-secondary focus:border-transparent transition-all" />
            </div>

            <div class="form-group">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-secondary focus:border-transparent transition-all" />
            </div>

            <div class="forgot-password text-right text-sm">
                <a href="#" class="text-gray-600 hover:text-gray-800 hover:underline">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-full py-3 bg-secondary text-white rounded-md hover:bg-blue-700 transition-all font-medium">Log In</button>

            <div class="footer-text mt-6 text-center text-sm text-gray-600">
                Don't have an account?
                <a href="{% url 'signin' %}" class="signup-link text-secondary font-medium hover:underline">Sign Up</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
