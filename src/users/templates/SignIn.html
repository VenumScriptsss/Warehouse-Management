{% extends 'base.html' %}
{% block title %}Sign In - Warehouse Management{% endblock %}

{% block content %}
<div class="auth-page min-h-[calc(100vh-120px)] py-8 flex items-center justify-center">
    <div class="auth-container bg-white rounded-xl p-8 shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-primary text-center mb-6">Create Account</h1>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div class="form-group">
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-secondary focus:border-transparent transition-all" />
            </div>

            <div class="form-group">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-secondary focus:border-transparent transition-all" />
            </div>

            <div class="form-group">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-secondary focus:border-transparent transition-all" />
            </div>

            <div class="form-group">
                <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-secondary focus:border-transparent transition-all" />
            </div>

            <div class="form-group">
                <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                <select id="role" name="role" required class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-secondary focus:border-transparent transition-all">
                    <option value="operator">Operator</option>
                    <option value="manager">Manager</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="form-group">
                <label for="warehouse" class="block text-sm font-medium text-gray-700 mb-1">Warehouse</label>
                <select id="warehouse" name="warehouse" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-secondary focus:border-transparent transition-all">
                    <option value="">Select Warehouse</option>
                    {% for warehouse in warehouses %}
                    <option value="{{ warehouse.id }}">{{ warehouse.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="w-full py-3 bg-secondary text-white rounded-md hover:bg-blue-700 transition-all font-medium">Create Account</button>

            <div class="error-message text-sm text-danger mt-2 min-h-[20px]" id="error-message">
                <!-- Error messages will appear here -->
            </div>

            <div class="footer-text mt-4 text-center text-sm text-gray-600">
                Already have an account?
                <a href="{% url 'login' %}" class="login-link text-secondary font-medium hover:underline">Log In</a>
            </div>
        </form>
    </div>
</div>

<script>
    // Simple form validation
    document.querySelector("form").addEventListener("submit", function (e) {
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm_password").value;
        const errorMessage = document.getElementById("error-message");

        if (password !== confirmPassword) {
            e.preventDefault();
            errorMessage.textContent = "Passwords do not match";
            errorMessage.style.display = "block";
        }
    });
</script>
{% endblock %}
